name: chukyso

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./src/signaturecheck-frontend
      args:
        API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    build:
      context: ./src/SignatureCheck.Web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-https://chukyso.automation.info.vn}
      DSS_VALIDATOR_URL: http://dss-validator:8080
      RateLimit__PermitLimit: ${RATE_LIMIT_PERMIT_LIMIT:-30}
      RateLimit__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ReverseProxy__TrustForwardedHeaders: "true"
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-5000}:8080"
    depends_on:
      dss-validator:
        condition: service_healthy
        restart: true
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  dss-validator:
    build:
      context: ./src/DssValidator
    environment:
      SIGNATURE_CHECK_TRUST_STORE_PATH: ${SIGNATURE_CHECK_TRUST_STORE_PATH:-/trust/vietnam-root.p12}
      SIGNATURE_CHECK_TRUST_STORE_TYPE: ${SIGNATURE_CHECK_TRUST_STORE_TYPE:-PKCS12}
      SIGNATURE_CHECK_TRUST_STORE_PASSWORD: ${SIGNATURE_CHECK_TRUST_STORE_PASSWORD:-changeit}
      SIGNATURE_CHECK_ADJUNCT_STORE_PATH: ${SIGNATURE_CHECK_ADJUNCT_STORE_PATH:-/trust/vietnam-public-adjunct.p12}
      SIGNATURE_CHECK_ADJUNCT_STORE_TYPE: ${SIGNATURE_CHECK_ADJUNCT_STORE_TYPE:-PKCS12}
      SIGNATURE_CHECK_ADJUNCT_STORE_PASSWORD: ${SIGNATURE_CHECK_ADJUNCT_STORE_PASSWORD:-changeit}
      SIGNATURE_CHECK_REVOCATION_OCSP_ENABLED: ${SIGNATURE_CHECK_REVOCATION_OCSP_ENABLED:-true}
      SIGNATURE_CHECK_REVOCATION_CRL_ENABLED: ${SIGNATURE_CHECK_REVOCATION_CRL_ENABLED:-true}
      SIGNATURE_CHECK_REVOCATION_FALLBACK_ENABLED: ${SIGNATURE_CHECK_REVOCATION_FALLBACK_ENABLED:-true}
      SIGNATURE_CHECK_REVOCATION_CACHE_ENABLED: ${SIGNATURE_CHECK_REVOCATION_CACHE_ENABLED:-true}
      SIGNATURE_CHECK_REVOCATION_CACHE_DIRECTORY: ${SIGNATURE_CHECK_REVOCATION_CACHE_DIRECTORY:-/tmp/dss-revocation-cache}
      SIGNATURE_CHECK_REVOCATION_TIMEOUT_CONNECTION_MILLIS: ${SIGNATURE_CHECK_REVOCATION_TIMEOUT_CONNECTION_MILLIS:-3000}
      SIGNATURE_CHECK_REVOCATION_TIMEOUT_CONNECTION_REQUEST_MILLIS: ${SIGNATURE_CHECK_REVOCATION_TIMEOUT_CONNECTION_REQUEST_MILLIS:-3000}
      SIGNATURE_CHECK_REVOCATION_TIMEOUT_RESPONSE_MILLIS: ${SIGNATURE_CHECK_REVOCATION_TIMEOUT_RESPONSE_MILLIS:-5000}
      SIGNATURE_CHECK_REVOCATION_TIMEOUT_SOCKET_MILLIS: ${SIGNATURE_CHECK_REVOCATION_TIMEOUT_SOCKET_MILLIS:-5000}
    volumes:
      - ./trust/vietnam-root.p12:/trust/vietnam-root.p12:ro
      - ./trust/vietnam-public-adjunct.p12:/trust/vietnam-public-adjunct.p12:ro
      - dss-revocation-cache:/tmp/dss-revocation-cache
    expose:
      - "8080"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  dss-revocation-cache:
